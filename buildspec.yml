version: 0.2

# Set these in CodeBuild project → Environment variables (Plaintext or Parameter Store)
# SUPABASE_URL, SUPABASE_KEY, JWT_SECRET,
# NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY, NEXT_PUBLIC_API_URL

phases:
  install:
    runtime-versions:
      python: 3.11
      nodejs: 18
    commands:
      - echo "Installing backend dependencies..."
      - pip install -r backend/requirements.txt
      - echo "Installing frontend dependencies..."
      - cd frontend/my-app && npm install && cd ../..

  pre_build:
    commands:
      # Write .env for backend so it can be verified
      - |
        cat > backend/.env << EOF
        SUPABASE_URL=${SUPABASE_URL}
        SUPABASE_KEY=${SUPABASE_KEY}
        JWT_SECRET=${JWT_SECRET}
        TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
        TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
        SMTP_HOST=smtp.gmail.com
        SMTP_PORT=587
        SMTP_USER=
        SMTP_PASS=
        ALERT_EMAIL=
        EOF
      # Write .env.local for frontend build
      - |
        cat > frontend/my-app/.env.local << EOF
        NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        EOF
      - echo "Verifying backend..."
      - cd backend && python -c "from app import app; print('Backend OK')" && cd ..

  build:
    commands:
      - echo "Building frontend..."
      - cd frontend/my-app && npm run build && cd ../..
      - mkdir -p backend/models
      - echo "Packaging backend (includes .env)..."
      - zip -r backend-build.zip backend/ -x "backend/__pycache__/*" -x "backend/*.pyc"
      - echo "Packaging frontend (includes .env.local and .next)..."
      - zip -r frontend-build.zip frontend/my-app/.next frontend/my-app/public frontend/my-app/package.json frontend/my-app/next.config.mjs frontend/my-app/.env.local

  post_build:
    commands:
      - echo "Build completed successfully"

artifacts:
  files:
    - backend-build.zip
    - frontend-build.zip
    - appspec.yml
    - scripts/**/*
  discard-paths: no

cache:
  paths:
    - frontend/my-app/node_modules/**/*
    - /root/.cache/pip/**/*
