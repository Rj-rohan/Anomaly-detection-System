version: 0.2

# Set these in CodeBuild → Edit → Environment → Environment variables (Plaintext):
# SUPABASE_URL, SUPABASE_KEY, JWT_SECRET
# NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY, NEXT_PUBLIC_API_URL

phases:
  install:
    runtime-versions:
      python: 3.11
      nodejs: 18
    commands:
      - echo "Runtime versions installed"
      - node --version
      - npm --version
      - python3 --version

  pre_build:
    commands:
      - echo "Installing backend dependencies..."
      - pip3 install -r backend/requirements.txt
      - echo "Installing frontend dependencies..."
      - npm install --prefix frontend/my-app
      - echo "Writing backend .env..."
      - echo "SUPABASE_URL=${SUPABASE_URL}" > backend/.env
      - echo "SUPABASE_KEY=${SUPABASE_KEY}" >> backend/.env
      - echo "JWT_SECRET=${JWT_SECRET}" >> backend/.env
      - echo "TELEGRAM_BOT_TOKEN=" >> backend/.env
      - echo "TELEGRAM_CHAT_ID=" >> backend/.env
      - echo "SMTP_HOST=smtp.gmail.com" >> backend/.env
      - echo "SMTP_PORT=587" >> backend/.env
      - echo "SMTP_USER=" >> backend/.env
      - echo "SMTP_PASS=" >> backend/.env
      - echo "ALERT_EMAIL=" >> backend/.env
      - echo "Writing frontend .env.local..."
      - echo "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}" > frontend/my-app/.env.local
      - echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" >> frontend/my-app/.env.local
      - echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}" >> frontend/my-app/.env.local
      - echo "Pre-build done"

  build:
    commands:
      - echo "Building Next.js frontend..."
      - npm run build --prefix frontend/my-app
      - echo "Creating models directory..."
      - mkdir -p backend/models
      - echo "Packaging backend..."
      - zip -r backend-build.zip backend/ -x "backend/__pycache__/*" -x "backend/*.pyc" -x "backend/models/*.pkl"
      - echo "Packaging frontend..."
      - zip -r frontend-build.zip frontend/my-app/.next frontend/my-app/public frontend/my-app/package.json frontend/my-app/next.config.mjs frontend/my-app/.env.local
      - echo "Build completed"
      - ls -lh backend-build.zip frontend-build.zip

artifacts:
  files:
    - backend-build.zip
    - frontend-build.zip
    - appspec.yml
    - scripts/**/*
  discard-paths: no

cache:
  paths:
    - frontend/my-app/node_modules/**/*
    - /root/.cache/pip/**/*
