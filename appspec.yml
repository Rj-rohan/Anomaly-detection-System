version: 0.0
os: linux
files:
  - source: backend-build.zip
    destination: /home/ec2-user/anomaly/backend-build.zip
  - source: frontend-build.zip
    destination: /home/ec2-user/anomaly/frontend-build.zip
  - source: scripts
    destination: /home/ec2-user/anomaly/scripts

hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 300
      runas: root

  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 600
      runas: root

  ApplicationStart:
    - location: scripts/start_app.sh
      timeout: 300
      runas: root

  ApplicationStop:
    - location: scripts/stop_app.sh
      timeout: 120
      runas: root

  ValidateService:
    - location: scripts/validate.sh
      timeout: 60
      runas: root
